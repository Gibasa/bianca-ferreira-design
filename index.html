<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/irg2hbx.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />



    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11495402064"></script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      /* Consent Mode v2: tudo negado até o visitante aceitar no aviso de cookies
         (src/components/Cookie). A escolha fica salva em localStorage.cookieConsent. */
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        wait_for_update: 500,
      });
      try {
        var consent = localStorage.getItem("cookieConsent");
        if (!consent && localStorage.getItem("cookiesAccepted")) consent = "granted"; // aviso antigo
        if (consent === "granted") {
          gtag("consent", "update", {
            ad_storage: "granted",
            ad_user_data: "granted",
            ad_personalization: "granted",
            analytics_storage: "granted",
          });
        }
      } catch (e) {}

      gtag("js", new Date());

      /* Pageviews: o GA4 envia o da carga da página e os das trocas de rota
         (medição otimizada, "alterações de página com base no histórico"). Não enviar manualmente. */

      /* Google Ads */
      gtag("config", "AW-11495402064");

      /* Google Analytics 4 */
      gtag("config", "G-BD8ZPNF0Q9");
    </script>

    <!-- Snippet para medir cliques antes da conversão -->
    <script>
      function gtagSendEvent(url) {
        var callback = function () {
          if (typeof url === "string") {
            window.location = url;
          }
        };

        gtag("event", "manual_event_PAGE_VIEW", {
          event_callback: callback,
          event_timeout: 2000,
        });

        return false;
      }
    </script>

    <title>Bianca Ferreira Design</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
